# Upstream's base Deployment carries prometheus.io/scrape annotations, but this
# cluster runs kube-prometheus-stack with additionalScrapeConfigs empty, and the
# operator does not scrape on those annotations — only ServiceMonitor/PodMonitor.
# Verified 2026-08-20: before this object existed, Prometheus held zero
# litescaler_* series.
#
# `release: prometheus-stack` is required: the Prometheus CR selects pod monitors
# with podMonitorSelector matchLabels {release: prometheus-stack}. Its
# podMonitorNamespaceSelector is {}, so living in kube-system is fine.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: lite-scaler
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: lite-scaler
  podMetricsEndpoints:
    # Port name from the base Deployment, not a number, so a port change here
    # cannot silently orphan the scrape.
    - port: metrics
      path: /metrics
