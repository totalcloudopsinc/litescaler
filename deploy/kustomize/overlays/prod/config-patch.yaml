apiVersion: v1
kind: ConfigMap
metadata:
  name: lite-scaller-config
data:
  config.yaml: |
    yandex_cloud:
      service_account_key_file: /secrets/sa-key.json
      node_group_id: REPLACE_WITH_PROD_NODE_GROUP_ID
      cluster_id: REPLACE_WITH_PROD_CLUSTER_ID
      master_endpoint: internal

    kubernetes:
      namespace: bot-prod
      label_selectors:
        - REPLACE_WITH_PROD_POD_LABEL   # e.g. app=bot-prod-worker

    scaling:
      pending_pod_threshold: 0
      headroom: 0.10
      max_size: 45                      # worker-prod ceiling
      min_size: 1
      scale_down_cooldown_polls: 3
      poll_interval_seconds: 30
      dry_run: false                    # prod scales for real; override per-deploy with install.sh --dry-run
      log_level: INFO
      node_capacity_fallback:           # match the prod node size (highfreq-v3 32 vCPU / 64 GiB)
        cpu: 32
        memory_gib: 64
