apiVersion: apps/v1
kind: Deployment
metadata:
  name: lite-scaler
spec:
  template:
    spec:
      # Pin to a STABLE node that the scaler never resizes (not the managed
      # group it scales), or a scale-down could drain the scaler's own node.
      nodeSelector:
        workload: infra
      # infra nodes carry `dedicated=infra:NoSchedule`, so the nodeSelector alone
      # leaves the pod Pending forever. The toleration is what makes it schedule.
      tolerations:
        - key: dedicated
          operator: Equal
          value: infra
          effect: NoSchedule
      containers:
        - name: lite-scaler
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              # See the dev overlay: free-capacity accounting lists every pod in
              # the cluster, so the footprint scales with total cluster size, not
              # with this environment. 128Mi OOM-killed it on dev at 702 pods, and
              # prod bursts to 45 worker nodes on top of that.
              memory: 512Mi
