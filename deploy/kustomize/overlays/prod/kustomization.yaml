apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kube-system

resources:
  - ../../base

patches:
  - path: config-patch.yaml
    target:
      kind: ConfigMap
      name: lite-scaler-config
  - path: deployment-patch.yaml

images:
  - name: cr.yandex/crpcvsde88m85as3hdu0/lite-scaler
    newTag: latest   # prod: pin to an immutable tag (e.g. a git SHA) before real use
