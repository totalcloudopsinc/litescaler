name: Deploy lite-scaler to k8s prod

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scaler dry_run for this deploy (overlay-default keeps the overlay's value = false in prod)"
        type: choice
        options:
          - overlay-default
          - "true"
          - "false"
        default: overlay-default
  pull_request:
    types:
      - closed
    branches:
      - master
  push:
    branches:
      - "**"

env:
  REGISTRY: cr.yandex
  REPO: cr.yandex/crpcvsde88m85as3hdu0/lite-scaler
  IMAGE_TAG: prod-${{ github.sha }}
  ENVIRONMENT: prod
  OVERLAY: deploy/kustomize/overlays/prod
  # Must match `namespace:` in the overlay's kustomization.yaml.
  NAMESPACE: kube-system

jobs:
  deploy_prod:
    # prod deploy triggers, mirroring BotsService:
    #   - manual workflow_dispatch, OR
    #   - a PR merged into `master`, OR
    #   - any push whose commit message contains `deploy to prod` (not a Merge).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'master') ||
      (github.event_name == 'push' &&
       contains(github.event.head_commit.message, 'deploy to prod') &&
       !startsWith(github.event.head_commit.message, 'Merge'))

    runs-on: [bot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: lite-scaler-builder
          cleanup: false

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          push: true
          tags: |
            ${{ env.REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}:buildcache,mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true

      - name: Deploy (kustomize)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'overlay-default' }}
        run: |
          set -euo pipefail
          IMAGE="${REPO}:${IMAGE_TAG}"
          echo "Deploying $ENVIRONMENT overlay with image $IMAGE (dry_run: $DRY_RUN)"

          # Pin the freshly-built image into the rendered manifest. The pattern is
          # derived from $REPO (with dots escaped) rather than hardcoded, so
          # changing the registry cannot silently stop matching and ship whatever
          # tag the overlay happens to carry.
          REPO_RE="${REPO//./\\.}"

          render() {
            kubectl kustomize "$OVERLAY" \
              | sed -E "s#^([[:space:]]*)image:[[:space:]]*${REPO_RE}:.*#\1image: ${IMAGE}#"
          }

          if [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "false" ]; then
            render | sed -E "s/^([[:space:]]*)dry_run:[[:space:]]*(true|false).*/\1dry_run: ${DRY_RUN}/" > manifest.yaml
          else
            render > manifest.yaml
          fi

          # Deploying the wrong version silently is worse than failing here.
          grep -qF "image: ${IMAGE}" manifest.yaml || {
            echo "ERROR: rendered manifest does not reference ${IMAGE}" >&2
            grep -n 'image:' manifest.yaml >&2
            exit 1
          }

          kubectl apply -f manifest.yaml

          # The ConfigMap is a plain resource, not a configMapGenerator, so it has
          # no content hash in its name and changing config.yaml alone leaves the
          # pod spec untouched — no rollout, and `rollout status` would report
          # success while the pod keeps running the old config. Force a new pod.
          kubectl -n "$NAMESPACE" rollout restart deploy/lite-scaler
          kubectl -n "$NAMESPACE" rollout status deploy/lite-scaler --timeout=120s
