name: Deploy lite-scaler to k8s dev

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scaler dry_run for this deploy (overlay-default keeps the overlay's value)"
        type: choice
        options:
          - overlay-default
          - "true"
          - "false"
        default: overlay-default
  push:
    branches:
      - "**"

env:
  REGISTRY: cr.yandex
  REPO: cr.yandex/crpcvsde88m85as3hdu0/lite-scaler
  IMAGE_TAG: ${{ github.sha }}
  ENVIRONMENT: dev
  OVERLAY: deploy/kustomize/overlays/dev
  # Must match `namespace:` in the overlay's kustomization.yaml.
  NAMESPACE: kube-system

jobs:
  # Runs on every push, including branches that never deploy. The suite is pure
  # Python and takes about a second, so it stays on a GitHub-hosted runner
  # rather than occupying the shared self-hosted [bot] machine.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Same minor as the Dockerfile (python:3.12-slim); pydantic-core has no
          # wheels for every newer interpreter and would try to build from source.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

  deploy_dev:
    # dev deploy triggers, mirroring BotsService:
    #   - manual workflow_dispatch, OR
    #   - push to the `dev` branch, OR
    #   - any push whose commit message contains `deploy to dev` (not a Merge).
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'deploy to dev') && !startsWith(github.event.head_commit.message, 'Merge'))

    needs: test
    runs-on: [bot]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Fail in seconds rather than after a multi-minute image build. Both checks
      # below are the two ways this deploy is known to break on a fresh runner:
      # no kubeconfig, or a kubeconfig whose identity cannot touch kube-system
      # (the runner's day job is BotsService, which only ever writes to bot-dev).
      - name: Preflight - cluster access
        run: |
          set -euo pipefail
          if ! kubectl version --request-timeout=10s >/dev/null 2>&1; then
            echo "ERROR: kubectl on this runner cannot reach a cluster." >&2
            echo "       Point its kubeconfig at ${{ env.ENVIRONMENT }} (see deploy/README.md)." >&2
            exit 1
          fi
          for verb in get patch; do
            if ! kubectl -n "$NAMESPACE" auth can-i "$verb" deployment >/dev/null 2>&1; then
              echo "ERROR: no permission to $verb deployments in namespace $NAMESPACE." >&2
              echo "       The runner identity needs write access there, not just in bot-dev." >&2
              exit 1
            fi
          done
          echo "cluster: $(kubectl config current-context), can write in $NAMESPACE"

      # The runner already holds cr.yandex credentials for the BotsService
      # registry. Ours is a different registry in the same folder, so ambient
      # credentials work only if the runner's identity carries the pusher role at
      # FOLDER level. Setting YC_CR_SA_KEY makes it deterministic instead: a
      # service account key JSON with container-registry.images.pusher on
      # crpcvsde88m85as3hdu0.
      - name: Log in to the registry
        env:
          SA_KEY: ${{ secrets.YC_CR_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${SA_KEY:-}" ]; then
            printf '%s' "$SA_KEY" | docker login "$REGISTRY" --username json_key --password-stdin
            echo "authenticated to $REGISTRY with the YC_CR_SA_KEY service account"
          else
            echo "::warning::YC_CR_SA_KEY is not set - relying on the runner's ambient $REGISTRY credentials. If the push below fails with 'denied: Permission denied', that identity lacks the pusher role on ${REPO%/*}."
          fi

      # Persistent builder on the self-hosted runner: keeps BuildKit state
      # (incl. RUN cache mounts) across runs.
      - name: Setup Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          name: lite-scaler-builder
          cleanup: false

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          # The cluster runs amd64 nodes. The runner is amd64 too, so this is a
          # native build, but pinning it keeps the image correct if the runner
          # fleet ever gains arm64 machines.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REPO }}:latest
            ${{ env.REPO }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.REPO }}:buildcache
          cache-to: type=registry,ref=${{ env.REPO }}:buildcache,mode=max,compression=zstd,image-manifest=true,oci-mediatypes=true

      # Deploy the dev overlay. The rendered manifest gets the freshly-built
      # image pinned by SHA, and dry_run is optionally overridden for this run.
      - name: Deploy (kustomize)
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'overlay-default' }}
        run: |
          set -euo pipefail
          IMAGE="${REPO}:${IMAGE_TAG}"
          echo "Deploying $ENVIRONMENT overlay with image $IMAGE (dry_run: $DRY_RUN)"

          # Pin the freshly-built image into the rendered manifest. The pattern is
          # derived from $REPO (with dots escaped) rather than hardcoded, so
          # changing the registry cannot silently stop matching and ship whatever
          # tag the overlay happens to carry.
          REPO_RE="${REPO//./\\.}"

          render() {
            kubectl kustomize "$OVERLAY" \
              | sed -E "s#^([[:space:]]*)image:[[:space:]]*${REPO_RE}:.*#\1image: ${IMAGE}#"
          }

          if [ "$DRY_RUN" = "true" ] || [ "$DRY_RUN" = "false" ]; then
            render | sed -E "s/^([[:space:]]*)dry_run:[[:space:]]*(true|false).*/\1dry_run: ${DRY_RUN}/" > manifest.yaml
          else
            render > manifest.yaml
          fi

          # Deploying the wrong version silently is worse than failing here.
          grep -qF "image: ${IMAGE}" manifest.yaml || {
            echo "ERROR: rendered manifest does not reference ${IMAGE}" >&2
            grep -n 'image:' manifest.yaml >&2
            exit 1
          }

          kubectl apply -f manifest.yaml

          # The ConfigMap is a plain resource, not a configMapGenerator, so it has
          # no content hash in its name and changing config.yaml alone leaves the
          # pod spec untouched — no rollout, and `rollout status` would report
          # success while the pod keeps running the old config. Force a new pod.
          kubectl -n "$NAMESPACE" rollout restart deploy/lite-scaler
          kubectl -n "$NAMESPACE" rollout status deploy/lite-scaler --timeout=120s

      # `rollout status` returns as soon as the pod is Ready, which for this
      # scaler only means the HTTP port is up. A config it cannot act on (wrong
      # node group, missing SA key) still looks healthy at that point.
      - name: Verify the scaler reached a decision
        run: |
          set -euo pipefail
          for _ in $(seq 1 12); do
            if kubectl -n "$NAMESPACE" logs -l app=lite-scaler --tail=200 \
                 | grep -q "app.scaling: decide:"; then
              echo "scaler is polling and reaching decisions:"
              kubectl -n "$NAMESPACE" logs -l app=lite-scaler --tail=200 \
                | grep -E "app.(scaling|service): (decide|Decision):" | tail -5
              exit 0
            fi
            sleep 10
          done
          echo "ERROR: no scaling decision logged within 120s - the pod is Ready but idle." >&2
          kubectl -n "$NAMESPACE" logs -l app=lite-scaler --tail=100 >&2
          exit 1
